# /etc/lock.conf: local settings of lock (sourced as shell by /usr/local/bin/lock; root:root 0644).
# install.sh writes this file on the first install and never overwrites it afterwards.

# Administrators: sshd always accepts them during a reservation, and they can end anyone's reservation.
# Keep at least one, so someone can always log in and undo a reservation.
ADMINS="@ADMINS@"

# Sum of the CPU use of other users (% of one core, sampled over 2 s) from which start refuses.
CPU_LIMIT=10

# Longer reservations are treated as typos.
MAX_DAYS=14

# --until is read and shown in this time zone, whatever the machine's zone is.
TIMEZONE=America/Sao_Paulo
TIMEZONE_LABEL="hora de Brasília"
