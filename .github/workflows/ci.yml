name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: lint and unit tests (Ubuntu 26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make docker-test

  e2e:
    # the newest VM GitHub offers; it also keeps lock covered on Ubuntu 24.04
    name: end-to-end (real sshd, systemd and sudo)
    runs-on: ubuntu-24.04
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make e2e
