name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: lint and unit tests (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    steps:
      - uses: actions/checkout@v4
      - run: make docker-test UBUNTU=${{ matrix.ubuntu }}

  e2e:
    name: end-to-end (real sshd, systemd and sudo)
    runs-on: ubuntu-24.04
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make e2e
